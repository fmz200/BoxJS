name: Release

on:
  push:
    tags: ['0.*']
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号 (须与 $.version 一致)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建一致性
        run: npm run check
      - name: 版本一致性
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run check:release
      - name: 生成锁定版模块与 Release notes
        env:
          VERSION: ${{ github.ref_name || inputs.version }}
        run: |
          node scripts/build-pinned-modules.mjs "$VERSION"
          node scripts/release-notes.mjs "$VERSION"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-body.md
          files: |
            dist/*.sgmodule
            dist/*.plugin
            dist/*.conf
            dist/*.stoverride
            dist/SHA256SUMS.txt

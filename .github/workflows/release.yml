name: Release

on:
  push:
    tags: ['0.*']
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号 (须与 $.version 一致)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建一致性
        run: npm run check
      - name: 版本一致性
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run check:release
      - name: 生成锁定版模块与 Release notes
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          node scripts/build-pinned-modules.mjs "$VERSION"
          node scripts/release-notes.mjs "$VERSION"
      - name: 校验发布署名与目标提交
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          node -e "const r=require('./box/release/box.release.json');const e=r.releases.find(x=>x.version===process.env.VERSION);if(!e||!e.author||!String(e.author).includes('fmz200')){console.error('署名校验失败:',e&&e.author);process.exit(1)}"
          echo "生成 Release 的提交: ${GITHUB_SHA}"
      - name: 清理已存在的同名 Release（支持重新发布）
        run: gh release delete "${{ inputs.version || github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          body_path: dist/release-body.md
          files: |
            dist/boxjs.rewrite.surge.sgmodule
            dist/boxjs.rewrite.loon.plugin
            dist/boxjs.rewrite.quanx.conf
            dist/boxjs.rewrite.stash.stoverride
            dist/SHA256SUMS.txt
